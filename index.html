  <!-- Fases del proceso: breadcrumb con ficha explicativa al pasar el ratón / clic -->

    <button type="button" class="phase" data-phase="datos" aria-expanded="false"><span class="step-n" aria-hidden="true">3</span> <span data-i18n="triaje.phases.ag_de_extraccion_de"></span></button><span class="arrow" data-lucide="chevron-right" aria-hidden="true"></span>
    <button type="button" class="phase" data-phase="reglas" aria-expanded="false"><span class="step-n" aria-hidden="true">4</span> <span data-i18n="triaje.phases.ag_de_reglas_de"></span></button><span class="arrow" data-lucide="chevron-right" aria-hidden="true"></span>
    <button type="button" class="phase" data-phase="registro" aria-expanded="false"><span class="step-n" aria-hidden="true">5</span> <span data-i18n="triaje.phases.trazabilidad"></span></button><span class="arrow" data-lucide="chevron-right" aria-hidden="true"></span>
    <button type="button" class="phase" data-phase="automatizacion" aria-expanded="false"><span class="step-n" aria-hidden="true">6</span> <span data-i18n="triaje.phases.automatizacion"></span></button>

    <div id="phase-pop" class="phase-pop" role="tooltip" hidden>
      <div class="phase-pop-caret" aria-hidden="true"></div>
      <div id="phase-pop-body" class="phase-pop-body"></div>
    </div>
  </nav>

  <!-- Marco común con gobierno.html (shell.js): menú lateral plegable (plegado, solo iconos) con usuario y botón al pie -->

      <details class="nav-sec">

        <div class="section-body">
          <select id="sel-paquete" data-i18n-attr="aria-label:triaje.sidebar.paquete_de_mensajes"></select>

          <ol id="paquete-lista" class="msg-list"></ol>
        </div>
      </details>
      <details class="nav-sec">
        <summary class="nav-item" data-i18n-attr="title:triaje.sidebar.configuracion"><span data-lucide="settings" aria-hidden="true"></span><span class="lbl" data-i18n="triaje.sidebar.configuracion"></span><span class="nav-chev" aria-hidden="true"></span></summary>
        <div class="section-body">
          <label>
            <span data-i18n="triaje.sidebar.motor_de_triaje"></span>
            <select id="sel-motor">
              <option value="auto" data-i18n="triaje.sel_motor.automatico_ia_si_esta"></option>
              <option value="guardado" data-i18n="triaje.sel_motor.resultados_guardados_reproduccion_35"></option>
              <option value="archivo" disabled data-i18n="triaje.sel_motor.archivo_cargado_reproduccion_35"></option>
            </select>
            <small id="motor-hint"></small>
          </label>
          <label>
            <span data-i18n="triaje.sidebar.reproducir_desde_archivo"></span>
            <input id="file-replay" type="file" accept="application/json,.json">
            <small data-i18n="triaje.sidebar.carga_un_json_exportado"></small>
          </label>
          <label>
            <span data-i18n="triaje.sidebar.llamadas_a_la_ia"></span>
            <select id="sel-estrategia">
              <option value="1paso" data-i18n="triaje.sel_estrategia.1_paso_clasificar_y"></option>
              <option value="2pasos" data-i18n="triaje.sel_estrategia.2_pasos_clasificar_ramo"></option>
            </select>
            <small data-i18n="triaje.sidebar.1_paso_una_llamada"></small>
          </label>
          <label class="check-row">
            <span class="check-line"><input id="chk-seud" type="checkbox" checked> <span data-i18n="triaje.sidebar.seudonimizar_antes_de_enviar"></span></span>
            <small data-i18n="triaje.sidebar.nombres_dni_telefono_iban"></small>
          </label>
        </div>
      </details>
      <details class="nav-sec">
        <summary class="nav-item" data-i18n-attr="title:triaje.sidebar.prompt"><span data-lucide="file-text" aria-hidden="true"></span><span class="lbl" data-i18n="triaje.sidebar.prompt"></span><span class="nav-chev" aria-hidden="true"></span></summary>
        <div class="section-body" id="prompt-sections"></div>
      </details>
      </div>
      <div class="sidenav-foot"></div>
    </nav>
    <div class="shell-main">

    <!-- Panel principal -->
      <!-- Conexión Azure AI Foundry (arriba, plegable) -->
      <section id="config-panel" class="card config" hidden>
        <h2 data-i18n="triaje.config_panel.azure_ai_foundry"></h2>
        <p class="hint" data-i18n-html="triaje.config_panel.la_configuracion_se_guarda"></p>
        <div class="grid-2">
          <label>
            <span data-i18n="triaje.config_panel.endpoint"></span>
            <input id="cfg-endpoint" type="url" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:triaje.cfg_endpoint.https_mi_recurso_services">
            <small data-i18n-html="triaje.config_panel.url_del_recurso_si"></small>
          </label>
          <label>
            <span data-i18n="triaje.config_panel.deployment_modelo"></span>
            <input id="cfg-deployment" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:triaje.cfg_deployment.gpt_5_nano">
          </label>
          <label>
            <span data-i18n="triaje.config_panel.ruta_de_api"></span>
            <select id="cfg-route">
              <option value="v1" data-i18n="triaje.cfg_route.v1_openai_v1_chat"></option>
              <option value="responses" data-i18n="triaje.cfg_route.responses_api_openai_v1"></option>
              <option value="deployments" data-i18n="triaje.cfg_route.clasica_openai_deployments_deployment"></option>
              <option value="models" data-i18n="triaje.cfg_route.foundry_models_models_chat"></option>
            </select>
          </label>
          <label>
            <span data-i18n-html="triaje.config_panel.api_version_solo_rutas"></span>
            <input id="cfg-api-version" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:triaje.cfg_api_version.2024_10_21_2024">
          </label>
          <label>
            <span data-i18n="triaje.config_panel.api_key"></span>
            <input id="cfg-api-key" type="password" placeholder="••••••••••••••••" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <div class="row">
          <button id="btn-test-ai" class="btn" type="button" data-i18n="triaje.btn_test_ai.probar_conexion"></button>
          <button id="btn-clear-ai" class="btn btn-ghost" type="button" data-i18n="triaje.btn_clear_ai.borrar_clave"></button>
          <span id="ai-status" class="status" role="status" aria-live="polite"></span>
        </div>
      </section>

    <main class="content">
      <section class="counters" data-i18n-attr="aria-label:triaje.shell.indicadores">
        <article class="card counter counter-ok">
          <span class="counter-label" data-i18n="triaje.shell.aprobados"></span>
          <span id="cnt-cleared" class="counter-value">0</span>
          <span id="pct-cleared" class="counter-sub">—</span>
        </article>
        <article class="card counter counter-review">
          <span class="counter-label" data-i18n="triaje.shell.a_revisar"></span>
          <span id="cnt-review" class="counter-value">0</span>
          <span id="pct-review" class="counter-sub">—</span>
        </article>
        <article class="card counter counter-time">
          <span class="counter-label" data-i18n="triaje.shell.tiempo_medio_de_ciclo"></span>
          <span id="cnt-cycle" class="counter-value">—</span>
          <span id="cycle-sub" class="counter-sub" data-i18n="triaje.cycle_sub.por_mensaje"></span>
        </article>
      </section>
      <div id="ramo-chips" class="chips" data-i18n-attr="aria-label:triaje.ramo_chips.desglose_por_ramo"></div>

      <section class="card actions">
        <div class="row wrap">
          <button id="btn-run" class="btn btn-primary" type="button"><span data-lucide="play" aria-hidden="true"></span> <span data-i18n="triaje.btn_run.procesar_paquete"></span></button>
          <button id="btn-pause" class="btn" type="button" disabled><span data-lucide="pause" aria-hidden="true"></span> <span data-i18n="triaje.btn_pause.pausar"></span></button>
          <button id="btn-reset" class="btn btn-ghost" type="button"><span data-lucide="rotate-ccw" aria-hidden="true"></span> <span data-i18n="triaje.btn_reset.reiniciar_lote"></span></button>
          <span id="run-status" class="status" role="status" aria-live="polite"></span>
        </div>
        <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
      </section>

      <section class="card log">
        <div class="row wrap between">
          <h2><span data-i18n="triaje.shell.registro_de_decisiones"></span> <span id="log-count" class="muted"></span></h2>
          <div class="row wrap">
            <label class="inline"><span data-i18n="triaje.shell.ramo"></span>
              <select id="filter-ramo">
                <option value="" data-i18n="triaje.filter_ramo.todos"></option>
                <option value="Auto" data-i18n="triaje.filter_ramo.auto"></option>
                <option value="Hogar" data-i18n="triaje.filter_ramo.hogar"></option>
                <option value="Salud" data-i18n="triaje.filter_ramo.salud"></option>
                <option value="Indeterminado" data-i18n="triaje.filter_ramo.indeterminado"></option>
              </select>
            </label>
            <label class="inline"><input id="filter-review" type="checkbox"> <span data-i18n="triaje.shell.solo_a_revisar"></span></label>
            <button id="btn-export-json" class="btn btn-ghost btn-sm" type="button"><span data-lucide="download" aria-hidden="true"></span> <span data-i18n="triaje.btn_export_json.exportar_json"></span></button>
            <button id="btn-export-csv" class="btn btn-ghost btn-sm" type="button"><span data-lucide="download" aria-hidden="true"></span> <span data-i18n="triaje.btn_export_csv.exportar_csv"></span></button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="log-table">
            <thead>
              <tr>
                <th data-sort="id" data-i18n="triaje.log_table.mensaje"></th>
                <th data-sort="ramo" data-i18n="triaje.shell.ramo"></th>
                <th data-sort="importe" data-i18n="triaje.log_table.importe"></th>
                <th data-sort="decision" data-i18n="triaje.log_table.decision"></th>
                <th data-i18n="triaje.log_table.motivo"></th>
                <th data-sort="origen" data-i18n="triaje.log_table.origen"></th>
                <th data-sort="confianza" data-i18n="triaje.log_table.conf"></th>
                <th data-sort="duracion_ms" data-i18n="triaje.log_table.ciclo"></th>
                <th data-sort="timestamp" data-i18n="triaje.log_table.hora"></th>
              </tr>
            </thead>
            <tbody id="log-body"></tbody>
          </table>
          <p id="log-empty" class="muted center" data-i18n="triaje.log_empty.todavia_no_hay_decisiones"></p>
        </div>
      </section>
    </main>
      <footer class="pie" data-i18n-html="triaje.shell.demo_estatica_html_javascript"></footer>
    </div>
  </div>

  <!-- Editor ancho de un bloque de prompt (el menú lateral es estrecho) -->
  <dialog id="modal-prompt" class="modal modal-prompt" aria-labelledby="modal-prompt-title">
    <div class="modal-head"><h2 id="modal-prompt-title"></h2><button class="btn btn-ghost btn-icon" type="button" onclick="this.closest('dialog').close()" data-i18n-attr="aria-label:triaje.modal_prompt.cerrar"><span data-lucide="x" aria-hidden="true"></span></button></div>
    <div class="modal-prompt-body">
      <textarea id="prompt-grande" spellcheck="false" data-i18n-attr="aria-label:triaje.prompt_grande.texto_del_bloque_de"></textarea>
      <div class="row between"><small class="muted" id="prompt-grande-count"></small>
        <span class="row"><button class="btn btn-ghost btn-sm" type="button" id="prompt-grande-restaurar" data-i18n="triaje.prompt_grande_restaurar.restaurar_original"></button><button class="btn btn-sm" type="button" onclick="this.closest('dialog').close()" data-i18n="triaje.modal_prompt.cancelar"></button><button class="btn btn-primary btn-sm" type="button" id="prompt-grande-guardar"><span data-lucide="check" aria-hidden="true"></span> <span data-i18n="triaje.prompt_grande_guardar.guardar"></span></button></span></div>
    </div>
  </dialog>

  <!-- Ficha de un mensaje -->
  <dialog id="modal" class="modal ficha" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="mh-title"><span id="modal-canal" class="mh-ico" aria-hidden="true"></span><h2 id="modal-title"></h2></div>
      <div class="mh-actions">
        <span id="modal-pos" class="mh-pos" aria-live="polite"></span>
        <button id="modal-prev" class="btn btn-ghost btn-icon" type="button" data-i18n-attr="title:triaje.modal_prev.anterior;aria-label:triaje.modal_prev.mensaje_anterior"></button>
        <button id="modal-next" class="btn btn-ghost btn-icon" type="button" data-i18n-attr="title:triaje.modal_next.siguiente;aria-label:triaje.modal_next.mensaje_siguiente"></button>
        <button id="modal-close" class="btn btn-ghost btn-icon" type="button" data-i18n-attr="aria-label:triaje.modal_prompt.cerrar"><span data-lucide="x" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="ficha-kpis" id="modal-kpis"></div>
    <div class="ficha-rev" id="modal-rev" hidden></div>
    <div class="ficha-tabs" id="modal-tabs" role="tablist" data-i18n-attr="aria-label:triaje.modal_tabs.secciones_de_la_ficha"></div>
    <div class="ficha-body">
      <section class="ficha-panel" id="tab-mensaje" role="tabpanel">
        <div class="ficha-resumen">
          <div class="ficha-col">
            <h3 data-i18n="triaje.tab_mensaje.datos_del_mensaje"></h3>
            <div class="box"><dl id="modal-mensaje" class="kv"></dl></div>
            <h3 data-i18n="triaje.tab_mensaje.mensaje_con_evidencias"></h3>
            <div id="modal-texto" class="msg-text msg-evid"></div>
          </div>
          <div class="ficha-col">
            <div class="ev-head">
              <h3 id="ev-titulo" aria-live="polite" data-i18n="triaje.ev_titulo.evidencias"></h3>
              <button id="btn-leyenda" class="btn-leyenda" type="button" aria-expanded="false" aria-controls="ev-pop"><span data-lucide="info" aria-hidden="true"></span> <span data-i18n="triaje.btn_leyenda.leyenda"></span></button>
              <div id="ev-pop" class="ev-pop" role="tooltip" hidden>
                <h4 data-i18n="triaje.ev_pop.leyenda_de_las_evidencias"></h4>
                <ul class="ev-leyenda" data-i18n-attr="aria-label:triaje.ev_pop.leyenda_de_colores_de">
                  <li data-kind="ev-ramo"><mark class="ev ev-ramo" data-i18n="triaje.ev_pop.ramo"></mark><span data-i18n-html="triaje.ev_pop.ramo_indicio_que_justifica"></span></li>
                  <li data-kind="ev-dato"><mark class="ev ev-dato" data-i18n="triaje.ev_pop.dato"></mark><span data-i18n-html="triaje.ev_pop.dato_extraido_poliza_importe"></span></li>
                  <li data-kind="ev-fecha"><mark class="ev ev-fecha" data-i18n="triaje.ev_pop.fecha"></mark><span data-i18n-html="triaje.ev_pop.fecha_del_hecho_cuando"></span></li>
                  <li data-kind="ev-incumple"><mark class="ev ev-incumple" data-i18n="triaje.ev_pop.regla"></mark><span data-i18n-html="triaje.ev_pop.regla_que_incumple_motivo"></span></li>
                  <li data-kind="ev-regla"><mark class="ev ev-regla" data-i18n="triaje.ev_pop.regla"></mark><span data-i18n-html="triaje.ev_pop.regla_que_cumple_prueba"></span></li>
                </ul>
                <p class="small muted"><span data-i18n="triaje.ev_pop.etiquetas"></span> <span class="ev-tag ok" data-i18n="triaje.ev_pop.verificada"></span> <span data-i18n="triaje.ev_pop.el_modelo_la_cito"></span> <span class="ev-tag aprox" data-i18n="triaje.ev_pop.reconstruida"></span> <span data-i18n="triaje.ev_pop.deducida_de_los_datos"></span> <span class="ev-tag ko" data-i18n="triaje.ev_pop.no_localizada"></span> <span data-i18n="triaje.ev_pop.la_cita_no_aparece"></span></p>
              </div>
            </div>
            <p class="small muted" id="modal-evid-resumen"></p>
            <ol id="modal-evid" class="ev-list"></ol>
          </div>
        </div>
      </section>
      <section class="ficha-panel" id="tab-adjuntos" role="tabpanel" hidden>
        <div class="adj-layout">
          <ul id="adj-lista" class="adj-lista" data-i18n-attr="aria-label:triaje.adj_lista.adjuntos_del_mensaje"></ul>
          <div class="adj-centro">
            <div id="adj-barra" class="adj-barra"></div>
            <div id="adj-visor" class="adj-visor"></div>
          </div>
          <aside id="adj-datos" class="adj-datos" data-i18n-attr="aria-label:triaje.adj_datos.datos_extraidos_del_adjunto"></aside>
        </div>
      </section>
      <section class="ficha-panel" id="tab-datos" role="tabpanel" hidden>
        <h3 data-i18n="triaje.tab_datos.datos_extraidos"></h3>
        <div class="box"><dl id="modal-datos" class="kv kv-wide"></dl></div>
      </section>
      <section class="ficha-panel" id="tab-reglas" role="tabpanel" hidden>
        <h3 id="modal-reglas-h" data-i18n="triaje.modal_reglas_h.reglas_de_negocio_del"></h3>
        <ul id="modal-criterios" class="criterios"></ul>
        <div id="modal-fraude-ind" class="fr-bloque"></div>
      </section>
      <section class="ficha-panel" id="tab-razonamiento" role="tabpanel" hidden>
        <div class="ficha-resumen">
          <div class="ficha-col">
            <h3 data-i18n="triaje.shell.ramo"></h3>
            <p id="modal-ramo"></p>
            <ul id="modal-ramo-criterios" class="ramo-criterios"></ul>
            <h3 data-i18n="triaje.log_table.decision"></h3>
            <dl id="modal-resultado" class="kv"></dl>
          </div>
          <div class="ficha-col">
            <div id="modal-sig" class="sig-card"></div>
            <h3 data-i18n="triaje.tab_razonamiento.cronologia_del_procesamiento"></h3>
            <ol id="modal-crono" class="crono"></ol>
          </div>
        </div>
      </section>
      <section class="ficha-panel" id="tab-json" role="tabpanel" hidden>
        <div class="row between wrap raw-head">
          <h3 style="margin:0;border:0;padding:0" data-i18n="triaje.tab_json.respuesta_cruda_del_modelo"></h3>
          <div class="row">
            <div class="seg" role="group" data-i18n-attr="aria-label:triaje.tab_json.contenido_de_la_respuesta">
              <button type="button" class="seg-btn" data-raw="enviado" aria-pressed="false" data-i18n="triaje.tab_json.enviado_al_modelo"></button>
              <button type="button" class="seg-btn" data-raw="modelo" aria-pressed="false" data-i18n="triaje.tab_json.salida_del_modelo"></button>
              <button type="button" class="seg-btn" data-raw="gobierno" aria-pressed="true" data-i18n="triaje.tab_json.gobierno"></button>
            </div>
            <button id="modal-copy-raw" class="btn btn-sm" type="button"></button>
          </div>
        </div>
